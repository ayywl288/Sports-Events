<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 圆角背景 -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- 外圈装饰环 -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="2 3"/>
  
  <!-- 抽象运动图标 - 融合跑道和人形 -->
  <g fill="url(#iconGrad)">
    <!-- 头部 -->
    <circle cx="32" cy="22" r="4"/>
    <!-- 身体躯干 -->
    <path d="M32 27 L32 38" stroke="url(#iconGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 手臂 - 向后摆动 -->
    <path d="M32 30 L22 26" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- 手臂 - 向前摆动 -->
    <path d="M32 30 L42 34" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- 腿 - 后蹬 -->
    <path d="M32 38 L25 48" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- 腿 - 前跨 -->
    <path d="M32 38 L40 46" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- 速度线条 -->
  <g stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="14" y1="30" x2="20" y2="30"/>
    <line x1="12" y1="34" x2="18" y2="34"/>
    <line x1="44" y1="28" x2="50" y2="28"/>
    <line x1="46" y1="32" x2="52" y2="32"/>
  </g>
</svg>
